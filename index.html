    <h1>حلول الطاقة الشمسية</h1>
    <p1 style="font-size: x-large; color:white;">احسب عدد الألواح الشمسية والتكلفة</p1>

    <div class="form-box">
        <form onsubmit="calculatePanels(); return false;">
            <label>👤 ادخل اسمك ثلاثي:</label>
            <input type="text" id="fullname" name="fullname" placeholder="مثال: أحمد محمد علي" required>

            <label>📍 أدخل عنوانك أو موقعك:</label>
            <input type="text" id="location" name="location" placeholder="مثال: الإسكندرية - سموحة" required>

            <label>🏠 نوع المكان:</label>
            <select id="placeType" name="placeType">
                <option>شقة</option>
                <option>فيلا</option>
                <option>مصنع</option>
                <option>عمارة</option>
                <option>شركة</option>
            </select>

            <label>🔋 كمية استهلاك الكهرباء شهرياً (ك.و.س):</label>
            <input type="number" id="consumption" name="consumption" placeholder="مثال: 1200" required>

            <label>☀️ نوع اللوح:</label>
            <select id="panelType" name="panelType">
                <option value="550">550 واط (≈ 3800 جنيه)</option>
                <option value="700">700 واط (≈ 5500 جنيه)</option>
            </select>

            <label>⚡ هل تريد بطارية؟</label>
            <select id="battery" name="battery">
                <option value="no">لا</option>
                <option value="yes">نعم (≈ 10000 جنيه)</option>
            </select>

            <button type="submit">احسب الآن</button>
        </form>

        <div class="result" id="result"></div>
    </div>

    <script>
        function calculatePanels() {
            let fullname   = document.getElementById("fullname").value;
            let location   = document.getElementById("location").value;
            let placeType  = document.getElementById("placeType").value;
            let consumption= document.getElementById("consumption").value;
            let panelType  = document.getElementById("panelType").value;
            let battery    = document.getElementById("battery").value;

            // نفترض أن اللوح 550 واط ينتج 66 ك.و.س شهرياً، واللوح 700 واط ينتج 84 ك.و.س شهرياً
            let panelCapacity = (panelType == "550") ? 66 : 84;
            let panelPrice    = (panelType == "550") ? 3800 : 5500;

            let panels    = Math.ceil(consumption / panelCapacity);
            let totalCost = panels * panelPrice;

            if (battery == "yes") {
                totalCost += 10000; // سعر البطارية التقريبي
            }

            document.getElementById("result").innerText =
                "👤 الاسم: " + fullname +
                "\n📍 الموقع: " + location +
                "\n🏠 نوع المكان: " + placeType +
                "\n🔋 الاستهلاك الشهري: " + consumption + " ك.و.س" +
                "\n☀️ عدد الألواح المطلوبة: " + panels + " لوح" +
                "\n💰 التكلفة الإجمالية: " + totalCost.toLocaleString() + " جنيه";
        }
    </script>
