<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>حاسبة الطاقة الشمسية</title>
    <style>
        body {
            font-family: Tahoma;
            text-align: center;
            background: url('4e1cc7391bcdb10ac0dc7bc8c4d0aefe.jpg') no-repeat center center fixed;
            background-size: cover;
        }
        h1 { color: #ff9800; }
        .form-box {
            background: white;
            padding: 20px;
            margin: 30px auto;
            width: 450px;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
        }
        label { display: block; margin-top: 10px; }
        input, select { width: 100%; padding: 8px; margin-top: 5px; }
        button {
            margin-top: 15px;
            padding: 10px;
            width: 100%;
            background: #ff9800;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover { background: #e68900; }
        .result {
            margin-top: 20px;
            font-weight: bold;
            color: green;
            white-space: pre-line;
        }
    </style>
</head>
<body>
    <h1>حلول الطاقة الشمسية</h1>
    <p style="font-size: x-large; color:white;">احسب عدد الألواح الشمسية والتكلفة</p>

    <div class="form-box">
        <form onsubmit="calculatePanels(); return false;">
            <label>👤 ادخل اسمك ثلاثي:</label>
            <input type="text" id="fullname" required>

            <label>📍 أدخل عنوانك أو موقعك:</label>
            <input type="text" id="location" required>

            <label>🏠 نوع المكان:</label>
            <select id="placeType">
                <option>شقة</option>
                <option>فيلا</option>
                <option>مصنع</option>
                <option>عمارة</option>
                <option>شركة</option>
            </select>

            <label>🔋 كمية استهلاك الكهرباء شهرياً (ك.و.س):</label>
            <input type="number" id="consumption" required>

            <label>☀️ نوع اللوح:</label>
            <select id="panelType">
                <option value="550">550 واط (≈ 3800 جنيه)</option>
                <option value="700">700 واط (≈ 5500 جنيه)</option>
            </select>

            <label>⚡ هل تريد بطارية؟</label>
            <select id="battery">
                <option value="no">لا</option>
                <option value="yes">نعم (≈ 10000 جنيه)</option>
            </select>

            <button type="submit">احسب الآن</button>
        </form>

        <div class="result" id="result"></div>

        <!-- زرار إرسال البيانات للـ Owner -->
        <button style="background:#25D366;" onclick="sendToOwner()">📤 إرسال البيانات للـ Owner</button>
    </div>

    <a href="solar-info.html"
       style="display:block; margin:20px auto; width:200px; text-align:center;
              background:#2196f3; color:white; padding:10px; border-radius:5px;
              text-decoration:none;">
       📖 اعرف المزيد عن الطاقة الشمسية
    </a>

    <div style="display:flex; justify-content:center; gap:20px; margin-top:30px;">
        <!-- زرار واتساب -->
        <a href="https://wa.me/201234567890"
           style="flex:1; max-width:200px; text-align:center;
                  background:#25D366; color:white; padding:12px; border-radius:5px;
                  text-decoration:none; font-weight:bold;">
           📱 واتساب
        </a>

        <!-- زرار اتصال -->
        <a href="tel:+201234567890"
           style="flex:1; max-width:200px; text-align:center;
                  background:#2196f3; color:white; padding:12px; border-radius:5px;
                  text-decoration:none; font-weight:bold;">
           ☎️ اتصال
        </a>
    </div>

    <script>
    let lastResult = "";

    function calculatePanels() {
        let fullname   = document.getElementById("fullname").value;
        let location   = document.getElementById("location").value;
        let placeType  = document.getElementById("placeType").value;
        let consumption= document.getElementById("consumption").value;
        let panelType  = document.getElementById("panelType").value;
        let battery    = document.getElementById("battery").value;

        // إنتاجية اللوح حسب النوع (بالك.و.س شهريًا)
        let panelCapacity;
        let panelPrice;

        if (panelType == "550") {
            panelCapacity = 82;   // تقريبًا 0.55 × 5 ساعات × 30 يوم
            panelPrice    = 17860; // السعر الجديد للوح 550 واط
        } else {
            panelCapacity = 105;  // تقريبًا 0.7 × 5 ساعات × 30 يوم
            panelPrice    = 17860; // السعر الجديد للوح 700 واط
        }

        // حساب عدد الألواح والتكلفة
        let panels    = Math.ceil(consumption / panelCapacity);
        let totalCost = panels * panelPrice;
        if (battery == "yes") totalCost += 10000;

        // حفظ النتيجة للعرض وللإرسال
        lastResult =
            "👤 الاسم: " + fullname +
            "\n📍 الموقع: " + location +
            "\n🏠 نوع المكان: " + placeType +
            "\n🔋 الاستهلاك الشهري: " + consumption + " ك.و.س" +
            "\n☀️ عدد الألواح المطلوبة: " + panels +
            "\n💰 التكلفة الإجمالية: " + totalCost.toLocaleString() + " جنيه" +
            "\n⚡ بطارية: " + battery;

        document.getElementById("result").innerText = lastResult;
    }

    function sendToOwner() {
        if (lastResult === "") {
            alert("⚠️ لازم تحسب الأول قبل ما تبعت البيانات.");
            return;
        }
        let phoneNumber = "01201984921"; // غيري الرقم لرقمك الحقيقي
        let url = "https://wa.me/" + phoneNumber + "?text=" + encodeURIComponent("🚨 بيانات عميل:\n" + lastResult);
        window.open(url, "_blank");
    }
</script>

</body>
</html>
